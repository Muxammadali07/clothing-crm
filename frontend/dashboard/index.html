<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClothCo CRM</title>
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════ LOGIN ══════ -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">C</div>
    <h1 class="login-title">ClothCo CRM</h1>
    <p class="login-sub">Staff access only. Sign in to continue.</p>
    <form id="login-form">
      <label class="login-label">Email address</label>
      <input class="login-input" id="login-email" type="email" placeholder="you@crm.test" autocomplete="email" required />
      <label class="login-label">Password</label>
      <input class="login-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
      <button class="login-btn" type="submit" id="login-btn">Sign in</button>
      <div id="login-error" class="login-error hidden"></div>
    </form>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════ APP ═══════ -->
<div id="app" class="hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo-icon">C</div>
      <span class="sidebar-logo-text">Renodule CRM</span>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- injected by JS -->
    </nav>

    <div class="sidebar-footer">
      <div class="nav-item" id="logout-btn" data-label="Logout">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
        <span class="nav-label">Logout</span>
      </div>
    </div>

    <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Toggle sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width:12px;height:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
  </aside>

  <!-- MAIN -->
  <div id="main">

    <!-- TOPBAR -->
    <header id="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>

      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803 7.5 7.5 0 0015.803 15.803z"/></svg>
        <input class="search-input" id="topbar-search" type="text" placeholder="Search..." />
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle" title="Toggle theme">
          <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
          <svg id="theme-icon-dark" class="hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
        </button>

        <button class="icon-btn" title="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
          <span class="notif-dot"></span>
        </button>

        <div class="user-chip" id="user-chip">
          <div class="user-avatar" id="user-avatar-chip">U</div>
          <div>
            <div class="user-name" id="user-name-chip">User</div>
          </div>
          <span class="role-badge" id="role-badge-chip">admin</span>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main id="content">
      <div class="loader"><div class="spinner"></div></div>
    </main>
  </div><!-- /main -->
</div><!-- /app -->

<!-- MODAL -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Title</h2>
      <button class="modal-close" id="modal-close">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- TOASTS -->
<div id="toast-container"></div>

<script src="js/dashboard.js"></script>
</body>
</html>
